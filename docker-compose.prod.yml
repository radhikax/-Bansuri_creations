# Production stack. postgres, migrate and api read ${API_ENV_FILE:-.env.api}
# (copy .env.api.example); web reads only ${WEB_ENV_FILE:-.env.web} (copy
# .env.web.example), so the internet-facing container never holds API secrets.
# Images default to GHCR; `--build` builds locally.
name: bansuri

services:
  postgres:
    image: postgres:16-alpine
    env_file: ${API_ENV_FILE:-.env.api}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:-ghcr.io/radhikax/bansuri-api:latest}
    build: ./server
    env_file: ${API_ENV_FILE:-.env.api}
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${API_IMAGE:-ghcr.io/radhikax/bansuri-api:latest}
    build: ./server
    env_file: ${API_ENV_FILE:-.env.api}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/radhikax/bansuri-web:latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
        API_INTERNAL_URL: http://api:4000
    env_file: ${WEB_ENV_FILE:-.env.web}
    environment:
      API_INTERNAL_URL: http://api:4000
      # Pin the web server's port and interface here rather than in .env.web,
      # so a PORT copied over from .env.api can't move it.
      PORT: "8080"
      HOSTNAME: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata-prod:
